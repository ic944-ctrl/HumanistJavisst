          4
        </span>
<span class="font-label-md text-label-md text-primary tracking-wide uppercase" id="progress-label-text" style="font-family: Barriecito, cursive; font-size: 16px; letter-spacing: 0.05em;">

<!-- Option A Card -->
<div class="cursor-pointer group relative flex flex-col p-4 rounded-xl transition-all duration-150 shadow-[3px_3px_0px_#334282] hover:-translate-y-0.5 active:translate-x-[2px] active:translate-y-[2px] active:shadow-[1px_1px_0px_#334282] bg-surface-container-lowest" id="card-option-a" onclick="selectOption('A')"><div class="flex items-start justify-between gap-3"><div class="flex items-center gap-2"><span class="w-8 h-8 rounded-lg bg-primary-container text-on-primary font-headline-md text-headline-md flex items-center justify-center shadow-[1px_1px_0px_#1b2b6a]">A</span></div><div class="w-6 h-6 rounded-full bg-surface-container-high flex items-center justify-center transition-colors" id="radio-indicator-a"><div class="w-2.5 h-2.5 rounded-full bg-transparent transition-all" id="radio-dot-a"></div></div></div><!-- Valfri bildsektion för alternativ A --><div class="hidden overflow-hidden rounded-lg mt-3 border border-outline-variant/30" id="image-wrapper-a"><img alt="Alternativ A bild" class="w-full h-36 object-cover" id="image-a" src=""/></div><div class="mt-3 flex flex-col gap-1"><h3 class="hidden font-headline-md text-headline-md text-primary leading-snug" id="title-a" style="font-family: Barriecito, cursive;"></h3><p class="font-body-lg text-body-lg text-primary font-medium leading-snug" id="desc-a">Jag analyserar orden, språket och vad som sägs mellan raderna i samtalet.</p></div><div class="h-1.5 w-0 bg-primary-container rounded-full mt-3 transition-all duration-300" id="accent-a"></div></div>

<!-- Option B Card -->
<div class="cursor-pointer group relative flex flex-col p-4 rounded-xl transition-all duration-150 shadow-[3px_3px_0px_#334282] hover:-translate-y-0.5 active:translate-x-[2px] active:translate-y-[2px] active:shadow-[1px_1px_0px_#334282] bg-surface-container-lowest" id="card-option-b" onclick="selectOption('B')"><div class="flex items-start justify-between gap-3"><div class="flex items-center gap-2"><span class="w-8 h-8 rounded-lg bg-secondary text-on-secondary font-headline-md text-headline-md flex items-center justify-center shadow-[1px_1px_0px_#49672a]">B</span></div><div class="w-6 h-6 rounded-full bg-surface-container-high flex items-center justify-center transition-colors" id="radio-indicator-b"><div class="w-2.5 h-2.5 rounded-full bg-transparent transition-all" id="radio-dot-b"></div></div></div><!-- Valfri bildsektion för alternativ B --><div class="hidden overflow-hidden rounded-lg mt-3 border border-outline-variant/30" id="image-wrapper-b"><img alt="Alternativ B bild" class="w-full h-36 object-cover" id="image-b" src=""/></div><div class="mt-3 flex flex-col gap-1"><h3 class="hidden font-headline-md text-headline-md text-primary leading-snug" id="title-b" style="font-family: Barriecito, cursive;"></h3><p class="font-body-lg text-body-lg text-primary font-medium leading-snug" id="desc-b">Jag sätter in problemet i ett historiskt och etiskt sammanhang för att förstå varför det uppstod.</p></div><div class="h-1.5 w-0 bg-secondary rounded-full mt-3 transition-all duration-300" id="accent-b"></div></div>
</div>
<!-- Visual Micro-Insight / Character callout -->
<!-- Navigation Action Bar -->
<div class="mt-6 flex items-center justify-between gap-3 pt-3">
<!-- Previous Button -->
<button class="flex-1 py-3 px-4 rounded-xl bg-surface-container-high text-primary font-label-lg text-label-lg flex items-center justify-center gap-1 shadow-[2px_2px_0px_#334282] transition-transform active:translate-x-[1px] active:translate-y-[1px] active:shadow-[1px_1px_0px_#334282]" onclick="history.back()" type="button">
<span class="material-symbols-outlined text-[20px]">west</span>
<span class="">Föregående</span>
</button>
<!-- Next Button (Active / Flare State) -->
<button class="flex-1 py-3 px-4 rounded-xl font-label-lg text-label-lg flex items-center justify-center gap-1.5 shadow-[3px_3px_0px_#334282] transition-all duration-150 active:translate-x-[2px] active:translate-y-[2px] active:shadow-[1px_1px_0px_#334282] bg-tertiary-fixed text-on-tertiary-fixed" id="next-btn" onclick="navigateNext()" type="button">
<span class="">Nästa fråga</span>
<span class="material-symbols-outlined text-[20px]">east</span>
</button>
</div>
</div>
<script>
  /**
   * =========================================================================
   * FRÅGEKONFIGURATION (Quiz Configuration)
   * =========================================================================
   * Här ställer du enkelt in all data för aktuell fråga:
   * - questionNumber: Vilket nummer frågan har (t.ex. 4)
   * - totalQuestions: Totalt antal frågor i testet (t.ex. 10)
   * - questionText: Själva frågerubriken
   * 
   * För varje alternativ i 'options':
   * - id: 'A' eller 'B'
   * - title: Valfri rubrik (lämna tom '' om endast brödtext önskas)
   * - description: Texten som beskriver valet
   * - image: Bild-URL eller placeholder (t.ex. 'https://lh3.googleusercontent.com/aida-public/AB6AXuCs-reaTOClA_oDiebbwJGsRmvul5cFEdQj8qmL2Y88p8VCNX7n6CHofGqs5nh_UYcd9uTO0wtXzIUlfHRb2x9jfEiOLhtNVIhNHWTBOovk-q3-7JzKB20KnTquu1AsWpvWLizNkVbxbndktGffZrCiw7rXv1alSjygEkBZcGbxAPV68sY7tSfA_ykN5KtqNwJvAtvKywMC-Tcn6afr9srUggYHPJDhiW_k-VTglJr31JCWOLv8kbdYmenmn07Qh6rvEd4').
   *          Om ingen bild önskas: sätt till null.
   * - isHumanist: true om detta val ger 1 humanist-poäng, annars false.
   * =========================================================================
   */
  const quizData = {
    questionNumber: 4,
    totalQuestions: 10,
    questionText: "Vilket väljer du helst?",
    options: [
      {
        id: 'A',
        title: '', // T.ex. 'Analysera orden...' (visas bara om angivet)
        description: 'Jag analyserar orden, språket och vad som sägs mellan raderna i samtalet.',
        image: null, // Byt ut mot t.ex. 'https://lh3.googleusercontent.com/aida-public/AB6AXuCs-reaTOClA_oDiebbwJGsRmvul5cFEdQj8qmL2Y88p8VCNX7n6CHofGqs5nh_UYcd9uTO0wtXzIUlfHRb2x9jfEiOLhtNVIhNHWTBOovk-q3-7JzKB20KnTquu1AsWpvWLizNkVbxbndktGffZrCiw7rXv1alSjygEkBZcGbxAPV68sY7tSfA_ykN5KtqNwJvAtvKywMC-Tcn6afr9srUggYHPJDhiW_k-VTglJr31JCWOLv8kbdYmenmn07Qh6rvEd4' om bild ska visas
        isHumanist: true // Sätt till true eller false
      },
      {
        id: 'B',
        title: '', // T.ex. 'Historiskt sammanhang...'
        description: 'Jag sätter in problemet i ett historiskt och etiskt sammanhang för att förstå varför det uppstod.',
        image: null, // Byt ut mot bild-URL om bild ska visas, annars null
        isHumanist: true // Sätt till true eller false
      }
    ]
  };

  // Exponera även globalt om andra skript behöver komma åt konfigurationen
  window.quizConfig = quizData;

  // Sparar vilket val användaren klickat på ('A' eller 'B')
  let selectedChoice = null;

  /**
   * Initierar frågevyn baserat på quizData vid sidladdning
   */
  function initQuiz() {
    // 1. Uppdatera rubrik och framstegsmätare
    const qNum = quizData.questionNumber;
    const total = quizData.totalQuestions;
    const pct = Math.round((qNum / total) * 100);

    const badgeEl = document.getElementById('progress-badge-num');
    const labelEl = document.getElementById('progress-label-text');
    const pctEl = document.getElementById('progress-pct-text');
    const fillEl = document.getElementById('progress-bar-fill');
    const titleEl = document.getElementById('question-text');

    if (badgeEl) badgeEl.textContent = qNum;
    if (labelEl) labelEl.textContent = `Fråga ${qNum} av ${total}`;
    if (pctEl) pctEl.textContent = `${pct}% avklarat`;
    if (fillEl) fillEl.style.width = `${pct}%`;
    if (titleEl) titleEl.textContent = quizData.questionText;

    // 2. Fyll i data för respektive alternativ (A och B)
    quizData.options.forEach(opt => {
      const key = opt.id.toLowerCase(); // 'a' eller 'b'
      const descEl = document.getElementById(`desc-${key}`);
      const titleOptEl = document.getElementById(`title-${key}`);
      const imgWrapper = document.getElementById(`image-wrapper-${key}`);
      const imgEl = document.getElementById(`image-${key}`);

      if (descEl) descEl.textContent = opt.description;

      // Visa rubrik om den finns angiven
      if (titleOptEl) {
        if (opt.title && opt.title.trim() !== '') {
          titleOptEl.textContent = opt.title;
          titleOptEl.classList.remove('hidden');
        } else {
          titleOptEl.classList.add('hidden');
        }
      }

      // Visa bild om angiven, annars göm bildsektionen
      if (imgWrapper && imgEl) {
        if (opt.image && opt.image.trim() !== '') {
          imgEl.src = opt.image;
          imgWrapper.classList.remove('hidden');
        } else {
          imgWrapper.classList.add('hidden');
          imgEl.src = '';
        }
      }
    });

    // 3. Om svar redan sparats tidigare i localStorage för denna fråga, återställ markering
    try {
      const storedAnswers = JSON.parse(localStorage.getItem('quizAnswers') || '{}');
      if (storedAnswers[quizData.questionNumber]) {
        selectOption(storedAnswers[quizData.questionNumber].choice);
      }
    } catch (e) {
      console.warn('Kunde inte läsa tidigare svar från localStorage:', e);
    }
  }

  /**
   * Hanterar användarens val av alternativ A eller B
   */
  function selectOption(choice) {
    selectedChoice = choice.toUpperCase();
    
    const cardA = document.getElementById('card-option-a');
    const cardB = document.getElementById('card-option-b');
    const radioA = document.getElementById('radio-dot-a');
    const radioB = document.getElementById('radio-dot-b');
    const radioIndA = document.getElementById('radio-indicator-a');
    const radioIndB = document.getElementById('radio-indicator-b');
    const accentA = document.getElementById('accent-a');
    const accentB = document.getElementById('accent-b');
    const nextBtn = document.getElementById('next-btn');

    if (selectedChoice === 'A') {
      // Aktivera kort A
      cardA.classList.add('bg-primary-fixed');
      cardA.classList.remove('bg-surface-container-lowest');
      radioIndA.classList.add('bg-primary-container');
      radioA.classList.add('bg-on-primary');
      accentA.classList.add('w-full');

      // Återställ kort B
      cardB.classList.remove('bg-secondary-container');
      cardB.classList.add('bg-surface-container-lowest');
      radioIndB.classList.remove('bg-secondary');
      radioB.classList.remove('bg-on-secondary');
      accentB.classList.remove('w-full');
    } else if (selectedChoice === 'B') {
      // Aktivera kort B
      cardB.classList.add('bg-secondary-container');
      cardB.classList.remove('bg-surface-container-lowest');
      radioIndB.classList.add('bg-secondary');
      radioB.classList.add('bg-on-secondary');
      accentB.classList.add('w-full');

      // Återställ kort A
      cardA.classList.remove('bg-primary-fixed');
      cardA.classList.add('bg-surface-container-lowest');
      radioIndA.classList.remove('bg-primary-container');
      radioA.classList.remove('bg-on-primary');
      accentA.classList.remove('w-full');
    }

    // Aktivera knappen "Nästa fråga"
    if (nextBtn) {
      nextBtn.removeAttribute('disabled');
      nextBtn.classList.remove('opacity-60');
      nextBtn.classList.add('bg-tertiary-fixed', 'text-on-tertiary-fixed');
    }
  }

  /**
   * Sparar resultatet i localStorage och navigerar vidare
   */
  function navigateNext() {
    if (!selectedChoice) return;
    
    // Hitta valt alternativ ur konfigurationen
    const chosenOption = quizData.options.find(opt => opt.id.toUpperCase() === selectedChoice);
    const givesHumanistPoint = chosenOption ? !!chosenOption.isHumanist : false;

    // Spara svar och humanist-poäng i localStorage
    try {
      // 1. Spara svar per fråga i 'quizAnswers'
      const quizAnswers = JSON.parse(localStorage.getItem('quizAnswers') || '{}');
      quizAnswers[quizData.questionNumber] = {
        questionNumber: quizData.questionNumber,
        choice: selectedChoice,
        isHumanist: givesHumanistPoint,
        timestamp: new Date().toISOString()
      };
      localStorage.setItem('quizAnswers', JSON.stringify(quizAnswers));

      // 2. Beräkna och uppdatera samlad humanistScore
      const totalHumanistScore = Object.values(quizAnswers).reduce((acc, curr) => {
        return acc + (curr.isHumanist ? 1 : 0);
      }, 0);
      localStorage.setItem('humanistScore', totalHumanistScore.toString());

      console.log(`Sparat fråga ${quizData.questionNumber}: Val=${selectedChoice}, Humanist-poäng=${givesHumanistPoint}, Total=${totalHumanistScore}`);
    } catch (e) {
      console.error('Kunde inte spara till localStorage:', e);
    }

    // Visuell klick-animation på knappen innan nästa steg
    const btn = document.getElementById('next-btn');
    if (btn) {
      btn.style.transform = 'scale(0.96)';
      setTimeout(() => {
        btn.style.transform = 'scale(1)';
        // Här kan navigering till nästa fråga eller resultat triggas
      }, 120);
    }
  }

  // Kör initiering vid laddning
  document.addEventListener('DOMContentLoaded', initQuiz);
  // Kör även direkt ifall DOMContentLoaded redan inträffat
  if (document.readyState === 'interactive' || document.readyState === 'complete') {
    initQuiz();
  }
</script></main>
